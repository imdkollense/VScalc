<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VScalc injustering</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #d9dde5;
  --accent: #c2410c; --accent-soft: #fde7da; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  --room: rgba(37, 99, 235, .12); --room-line: #2563eb; --room-sel: rgba(37, 99, 235, .28);
  --ext: #dc2626; --canvas: #eceff3;
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #9aa3b2; --line: #2f3542;
    --accent: #fb923c; --accent-soft: #3a2416; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --room: rgba(96, 165, 250, .14); --room-line: #60a5fa; --room-sel: rgba(96, 165, 250, .32);
    --ext: #f87171; --canvas: #0d1015;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #9aa3b2; --line: #2f3542;
  --accent: #fb923c; --accent-soft: #3a2416; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  --room: rgba(96, 165, 250, .14); --room-line: #60a5fa; --room-sel: rgba(96, 165, 250, .32);
  --ext: #f87171; --canvas: #0d1015;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; }
header h1 span { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.active, .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.danger { color: var(--bad); }
.spacer { flex: 1; }
main { padding: 16px; }
.view { display: none; }
.view.active { display: block; }
.drawing { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
@media (max-width: 900px) { .drawing { grid-template-columns: 1fr; } }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
.hint { color: var(--muted); font-size: 13px; min-height: 18px; margin-bottom: 6px; }
#canvasWrap { background: var(--canvas); border: 1px solid var(--line); border-radius: 8px; height: 70vh; min-height: 360px; overflow: hidden; position: relative; }
#plan { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
.room { fill: var(--room); stroke: var(--room-line); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: pointer; }
.room.sel { fill: var(--room-sel); }
.edge { stroke: transparent; stroke-width: 12; vector-effect: non-scaling-stroke; cursor: pointer; }
.edge.ext { stroke: var(--ext); stroke-width: 5; stroke-opacity: .85; }
.edge:hover { stroke: var(--accent); stroke-opacity: .6; }
.roomlabel { fill: var(--text); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; pointer-events: none; text-anchor: middle; }
.rad { fill: var(--accent); stroke: #fff; stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; }
.rad.unassigned { stroke: var(--accent); stroke-dasharray: 3 2; fill-opacity: .45; stroke-width: 1.5; }
.rad.incomplete { fill: var(--warn); }
.draft { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.vertex { fill: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.panel h2 { font-size: 15px; margin: 0 0 8px; }
.panel h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
label.f { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 8px; margin: 4px 0; }
input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; width: 100%; }
input[type=checkbox] { width: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
.edges td, .edges th { padding: 3px 4px; }
.edges input[type=number] { width: 64px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.kpi b { display: block; font-size: 20px; }
.kpi span { color: var(--muted); font-size: 12px; }
.scroll { overflow-x: auto; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 16px; width: min(460px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.4); }
.note { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
@media print { header nav, .toolbar, .noprint { display: none !important; } .view { display: block !important; } #v-plan { display: none !important; } }
</style>
</head>
<body>
<header>
  <h1>VS<span>calc</span></h1>
  <nav id="tabs">
    <button data-view="plan" class="active">Ritning</button>
    <button data-view="results">Resultat</button>
    <button data-view="settings">Indata</button>
    <button data-view="db">Radiatordatabas</button>
  </nav>
  <div class="spacer"></div>
  <button class="btn" id="btnExport">Spara projekt</button>
  <label class="btn">Öppna projekt<input type="file" id="fileProject" accept=".json" hidden></label>
  <button class="btn danger" id="btnNew">Nytt</button>
</header>

<main>
  <!-- RITNING -->
  <section class="view active" id="v-plan">
    <div class="drawing">
      <div>
        <div class="toolbar">
          <label class="btn">Ladda planritning<input type="file" id="fileImage" accept="application/pdf,.pdf,image/*" hidden></label>
          <button class="btn" data-mode="pan">Flytta</button>
          <button class="btn" data-mode="scale">Skala</button>
          <button class="btn" data-mode="room">Rita rum</button>
          <button class="btn" data-mode="rect">Rektangel</button>
          <button class="btn" data-mode="edge">Ytterväggar</button>
          <button class="btn" data-mode="rad">Placera radiator</button>
          <button class="btn" id="btnFit">Anpassa</button>
          <span class="note" id="scaleInfo"></span>
        </div>
        <div class="hint" id="hint"></div>
        <div id="canvasWrap"><svg id="plan"></svg></div>
      </div>
      <aside class="panel" id="sidePanel"></aside>
    </div>
  </section>

  <!-- RESULTAT -->
  <section class="view" id="v-results">
    <div class="kpi" id="kpi"></div>
    <div class="toolbar noprint">
      <button class="btn" id="btnCsv">Exportera CSV</button>
      <button class="btn" onclick="window.print()">Skriv ut</button>
    </div>
    <div class="panel scroll"><table id="resTable"></table></div>
    <p class="note" id="resNote"></p>
  </section>

  <!-- INDATA -->
  <section class="view" id="v-settings"><div class="settings" id="settingsForm"></div></section>

  <!-- DATABAS -->
  <section class="view" id="v-db">
    <div class="toolbar">
      <label class="btn">Importera CSV<input type="file" id="fileCsv" accept=".csv,.txt" hidden></label>
      <label><input type="checkbox" id="csvReplace" checked> Ersätt befintlig lista</label>
      <button class="btn" id="btnDbExport">Exportera CSV</button>
      <button class="btn" id="btnDbReset">Återställ standardlista</button>
    </div>
    <p class="note">CSV-kolumner (semikolon): <code>id; namn; typ; fabrikat; höjd; längd; effekt; enhet; normtemp; exponent</code>. <b>enhet</b> = <code>st</code> (hel radiator), <code>sektion</code> (effekt per sektion) eller <code>m</code> (effekt per meter). <b>normtemp</b> = fram/retur/rum som effekten anges vid, t.ex. <code>80/60/20</code>.</p>
    <div class="panel scroll"><table id="dbTable"></table></div>
  </section>
</main>

<dialog id="radDialog">
  <form method="dialog" id="radForm">
    <h2 style="margin-top:0">Välj radiator</h2>
    <p class="note" id="radRoom"></p>
    <label class="f" style="grid-template-columns:1fr">Sök<input id="radSearch" placeholder="t.ex. kolonn, 600"></label>
    <select id="radSelect" size="8" style="margin:6px 0"></select>
    <label class="f"><span id="radQtyLabel">Antal</span><input id="radQty" type="number" step="any" min="0" value="1"></label>
    <label class="f">Antal installerade (likadana)<input id="radCount" type="number" step="1" min="1" value="1"></label>
    <p class="note" id="radInfo"></p>
    <div class="toolbar" style="justify-content:flex-end;margin:12px 0 0">
      <button class="btn danger" value="del" id="radDel" hidden>Ta bort</button>
      <div class="spacer"></div>
      <button class="btn" value="cancel">Avbryt</button>
      <button class="btn active" value="ok" id="radOk">Placera</button>
    </div>
  </form>
</dialog>

<dialog id="askDialog">
  <form method="dialog">
    <p id="askText" style="margin-top:0"></p>
    <input id="askInput">
    <div class="toolbar" style="justify-content:flex-end;margin:12px 0 0">
      <button class="btn" value="cancel">Avbryt</button>
      <button class="btn active" value="ok">OK</button>
    </div>
  </form>
</dialog>

<script>
/* VScalc – beräkningskärna för injustering av vattenburna värmesystem.
 * Rena funktioner utan DOM-beroenden, så att de kan testas i Node.
 * Enheter: längd m, area m², temperatur °C, effekt W, flöde l/h, tryck kPa.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.VSCalc = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // Värmekapacitet per liter vatten, kJ/(l·K). 4,2 som i Strandskatan-mallen.
  const WATER_KJ_PER_LK = 4.2;
  const RHO_CP_AIR = 1.2 * 1005 / 1000; // W per (l/s)·K

  // ---------- Geometri ----------
  function polygonArea(pts) {
    let a = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      a += p.x * q.y - q.x * p.y;
    }
    return Math.abs(a) / 2;
  }
  function dist(p, q) { return Math.hypot(q.x - p.x, q.y - p.y); }
  function pointInPolygon(pt, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a.y > pt.y) !== (b.y > pt.y) &&
          pt.x < (b.x - a.x) * (pt.y - a.y) / (b.y - a.y) + a.x) inside = !inside;
    }
    return inside;
  }

  // ---------- Värmeförluster ----------
  /**
   * room: { area, height, tIn, walls:[{length, exterior, windowArea, doorArea}],
   *         above:'vind'|'tak'|'uppvarmt', below:'mark'|'kallare'|'kryprum'|'uppvarmt',
   *         airChanges (oms/h) }
   * s: { dvut, tGround, tBasement, tCrawl, uWall, uWindow, uDoor, uRoof, uFloor,
   *      airChanges, heatRecovery (0–1), thermalBridge (0–1) }
   */
  function roomHeatLoss(room, s) {
    const tIn = num(room.tIn, s.tIn);
    const dT = tIn - s.dvut;
    const h = num(room.height, s.height);
    const parts = [];
    let wallA = 0, winA = 0, doorA = 0;
    for (const w of room.walls || []) {
      if (!w.exterior) continue;
      const gross = w.length * h;
      const win = num(w.windowArea, 0), door = num(w.doorArea, 0);
      wallA += Math.max(0, gross - win - door);
      winA += win; doorA += door;
    }
    parts.push({ key: 'vagg', label: 'Yttervägg', area: wallA, u: s.uWall, dT, w: wallA * s.uWall * dT });
    parts.push({ key: 'fonster', label: 'Fönster', area: winA, u: s.uWindow, dT, w: winA * s.uWindow * dT });
    if (doorA > 0) parts.push({ key: 'dorr', label: 'Ytterdörr', area: doorA, u: s.uDoor, dT, w: doorA * s.uDoor * dT });

    const A = room.area;
    if (room.above === 'vind' || room.above === 'tak') {
      parts.push({ key: 'tak', label: room.above === 'vind' ? 'Vindsbjälklag' : 'Yttertak', area: A, u: s.uRoof, dT, w: A * s.uRoof * dT });
    }
    const tBelow = { mark: s.tGround, kallare: s.tBasement, kryprum: s.tCrawl }[room.below];
    if (tBelow !== undefined) {
      const dTf = tIn - tBelow;
      parts.push({ key: 'golv', label: 'Golv', area: A, u: s.uFloor, dT: dTf, w: A * s.uFloor * dTf });
    }
    const transmission = parts.reduce((t, p) => t + p.w, 0);
    const bridges = transmission * num(s.thermalBridge, 0);
    if (bridges > 0) parts.push({ key: 'kb', label: 'Köldbryggor', w: bridges });

    const n = num(room.airChanges, s.airChanges);
    const volume = A * h;
    const flowLs = n * volume / 3.6;
    const vent = RHO_CP_AIR * flowLs * dT * (1 - num(s.heatRecovery, 0));
    parts.push({ key: 'vent', label: 'Ventilation/infiltration', flowLs, w: vent });

    const total = parts.reduce((t, p) => t + p.w, 0);
    return { total, parts, dT, volume, exteriorWallArea: wallA, windowArea: winA };
  }

  // ---------- Radiatorer ----------
  /** Logaritmisk medeltemperaturdifferens. */
  function lmtd(tf, tr, ti) {
    const a = tf - ti, b = tr - ti;
    if (a <= 0 || b <= 0) return 0;
    if (Math.abs(a - b) < 1e-9) return a;
    return (a - b) / Math.log(a / b);
  }
  /** Medeltemperaturdifferens: 'aritmetisk' ((tf+tr)/2 − ti) eller 'logaritmisk' (LMTD). */
  function meanDiff(tf, tr, ti, method) {
    if (method === 'logaritmisk') return lmtd(tf, tr, ti);
    return Math.max(0, (tf + tr) / 2 - ti);
  }
  /** Normeffekt för en vald radiator (W) vid dess normtemperaturer. */
  function nominalPower(dbRad, qty) {
    return dbRad.power * (dbRad.unit === 'st' ? 1 : num(qty, 1));
  }
  /** Avgiven effekt vid aktuella temperaturer. */
  function radiatorOutput(pNom, norm, n, tf, tr, ti, method) {
    const ref = meanDiff(norm.tf, norm.tr, norm.ti, method);
    const act = meanDiff(tf, tr, ti, method);
    if (ref <= 0 || act <= 0) return 0;
    return pNom * Math.pow(act / ref, n);
  }
  /**
   * Beräknar returtemperatur och flöde som krävs för att radiatorn ska avge pReq.
   * Returnerar { ok, tr, flowLh, pMax, reason }.
   */
  function requiredFlow(pNom, norm, n, pReq, tf, ti, method) {
    const pMax = radiatorOutput(pNom, norm, n, tf, tf - 1e-6, ti, method);
    if (pReq <= 0) return { ok: true, tr: null, flowLh: 0, pMax };
    if (pReq >= pMax) return { ok: false, tr: null, flowLh: Infinity, pMax, reason: 'Radiatorn räcker inte ens vid oändligt flöde' };
    let lo = ti + 1e-6, hi = tf - 1e-6;
    for (let i = 0; i < 100; i++) {
      const mid = (lo + hi) / 2;
      if (radiatorOutput(pNom, norm, n, tf, mid, ti, method) < pReq) lo = mid; else hi = mid;
    }
    const tr = (lo + hi) / 2;
    return { ok: true, tf, tr, flowLh: flowFor(pReq, tf - tr), pMax };
  }
  /** Flöde l/h för effekt P (W) och temperaturfall dt. */
  function flowFor(p, dt) { return p / (dt * WATER_KJ_PER_LK * 1000) * 3600; }

  /**
   * Strandskatan-metoden: fast ΔT över radiatorn. Beräknar den tillopps- och
   * returtemperatur som krävs för att radiatorn ska avge pReq, samt flödet.
   */
  function requiredTempsAtDt(pNom, norm, n, pReq, dt, ti, method) {
    if (pReq <= 0 || pNom <= 0) return { ok: true, tf: null, tr: null, flowLh: 0 };
    const ref = meanDiff(norm.tf, norm.tr, norm.ti, method);
    const need = ref * Math.pow(pReq / pNom, 1 / n);
    let tf;
    if (method === 'logaritmisk') {
      let lo = ti + dt + 1e-6, hi = ti + dt + 500;
      for (let i = 0; i < 100; i++) { const mid = (lo + hi) / 2; if (lmtd(mid, mid - dt, ti) < need) lo = mid; else hi = mid; }
      tf = (lo + hi) / 2;
    } else tf = need + ti + dt / 2;
    return { ok: true, tf, tr: tf - dt, dTheta: need, flowLh: flowFor(pReq, dt) };
  }

  /** Danfoss RA-DV PURE: max flöde (l/h) per inställning och givare (från Ventildata-fliken). */
  const RADV_PURE = {
    settings: ['1', '1.5', '2', '2.5', '3', '3.5', '4', '4.5', '5', '5.5', '6', '6.5', '7', '7.5'],
    flows: {
      'Max': [10, 12.5, 15, 17.5, 20, 27.5, 35, 42.5, 50, 65, 80, 90, 100, 117.5],
      'RA 2000': [9, 11.5, 14, 16, 18, 24, 30, 37.5, 45, 57.5, 70, 80, 90, 110],
      'RAW/RAE/RAS-C': [8, 10, 12, 14, 16, 20.5, 25, 32.5, 40, 52.5, 65, 75, 85, 97.5],
    },
  };
  /** Lägsta inställning vars flöde ≥ behovet inkl. marginal (samma logik som Excel-mallen). */
  function valveSetting(flowLh, sensor, margin) {
    const tab = RADV_PURE.flows[sensor] || RADV_PURE.flows.Max;
    const q = flowLh * (1 + (margin || 0));
    if (!isFinite(q)) return { setting: null, maxFlow: null, status: 'Ej möjlig' };
    const i = tab.findIndex(v => v >= q);
    if (i < 0) return { setting: null, maxFlow: null, status: `Flödet överstiger max ${tab[tab.length - 1]} l/h` };
    return { setting: RADV_PURE.settings[i], maxFlow: tab[i], status: q < tab[0] ? 'Lägsta inställning ger mer än behovet' : 'OK' };
  }
  /** kv = q[m³/h] / sqrt(Δp[bar]) */
  function kv(flowLh, dpKPa) {
    if (!isFinite(flowLh) || dpKPa <= 0) return NaN;
    return (flowLh / 1000) / Math.sqrt(dpKPa / 100);
  }

  /**
   * Komplett beräkning för ett rum.
   * rads: [{ pNom (totalt för alla 'count' st), count, norm:{tf,tr,ti}, n, dpKPa? }]
   * sys: { mode:'dt'|'tf', dt, tf, trDesign, dpKPa, method, sensor, margin }
   * Effektbehovet fördelas på rummets radiatorer i proportion till normeffekt.
   */
  function roomBalance(need, tIn, rads, sys) {
    const m = sys.method;
    const pNomTot = rads.reduce((t, r) => t + r.pNom, 0);
    const installedDesign = rads.reduce((t, r) => t + radiatorOutput(r.pNom, r.norm, r.n, sys.tf, sys.trDesign, tIn, m), 0);
    const factor = need > 0 ? installedDesign / need : null;
    // Överdimensionering mot katalogeffekt (som mallens "tillgänglig effekt vid 90/70")
    const available = pNomTot;
    const overdim = need > 0 && available > 0 ? available / need - 1 : null;
    const perRad = rads.map(r => {
      const share = pNomTot > 0 ? r.pNom / pNomTot : 0;
      const pReq = need * share;
      const pAvail = radiatorOutput(r.pNom, r.norm, r.n, r.norm.tf, r.norm.tr, tIn, m);
      const f = sys.mode === 'dt'
        ? requiredTempsAtDt(pAvail, { tf: r.norm.tf, tr: r.norm.tr, ti: tIn }, r.n, pReq, sys.dt, tIn, m)
        : requiredFlow(r.pNom, r.norm, r.n, pReq, sys.tf, tIn, m);
      const count = Math.max(1, r.count || 1);
      const flowEach = f.flowLh / count;
      const dp = num(r.dpKPa, sys.dpKPa);
      // Som mallens kontroll: kräver radiatorn högre tillopp än katalogens referens räcker den inte i praktiken
      const overRef = f.ok && f.tf != null && sys.mode === 'dt' && f.tf > r.norm.tf;
      return Object.assign({ pReq, overRef, pAvail, count, flowEach, dpKPa: dp, kv: kv(flowEach, dp),
        valve: valveSetting(flowEach, sys.sensor, sys.margin),
        pDesign: radiatorOutput(r.pNom, r.norm, r.n, sys.tf, sys.trDesign, tIn, m) }, f);
    });
    const flowLh = perRad.reduce((t, r) => t + r.flowLh, 0);
    return { installedDesign, available, factor, overdim, perRad, flowLh, ok: perRad.every(r => r.ok),
      sufficient: perRad.every(r => r.ok && !r.overRef) };
  }

  /** Läser radiatorförteckning i CSV (semikolon eller komma). */
  function parseRadiatorCsv(text) {
    const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
    if (!lines.length) return [];
    const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
    const head = lines[0].split(sep).map(h => h.trim().toLowerCase());
    const col = (...names) => head.findIndex(h => names.includes(h));
    const c = {
      id: col('id'), name: col('namn', 'name', 'benämning'), type: col('typ', 'type'),
      maker: col('fabrikat', 'tillverkare'), h: col('höjd', 'hojd', 'höjd_mm', 'hojd_mm'),
      l: col('längd', 'langd', 'längd_mm', 'langd_mm', 'djup'), p: col('effekt', 'effekt_w', 'power'),
      unit: col('enhet', 'unit'), norm: col('normtemp', 'norm'), n: col('exponent', 'n'),
    };

    lines.slice(1).forEach((line, i) => {
      const v = line.split(sep).map(x => x.trim());
      const g = k => (c[k] >= 0 ? v[c[k]] : '');
      const p = parseFloat(String(g('p')).replace(',', '.'));
      if (!isFinite(p)) return;
      const nt = (g('norm') || '90/70/20').split('/').map(x => parseFloat(x.replace(',', '.')));

        id: g('id') || 'csv-' + (i + 1), name: g('name'), type: g('type'), maker: g('maker'),
        height: g('h'), length: g('l'), power: p,
        unit: (g('unit') || 'st').toLowerCase(),
        norm: { tf: nt[0], tr: nt[1], ti: nt[2] },
        n: parseFloat(String(g('n') || '1.3').replace(',', '.')) || 1.3,

  }

   * Hittar radiatorbeteckningar i fritext, t.ex. "MR 59-20", "MP2 44/16", "2×MR59-20", "MR 59 20 sekt".
   * Matchar bara serie + höjd som finns i databasen. Returnerar [{index, length, raw, dbId, qty, count}].

      out.push({ index: m.index, length: m[0].length, raw: m[0].trim(), dbId: d.id,

    }

    requiredFlow, requiredTempsAtDt, flowFor, valveSetting, RADV_PURE, kv, roomBalance, parseRadiatorCsv, findDesignations, WATER_KJ_PER_LK };
});

<script>
/* VScalc – gränssnitt. Beräkningar finns i calc.js (window.VSCalc). */

  'use strict';
  const C = window.VSCalc;
  const $ = s => document.querySelector(s);
  const SVGNS = 'http://www.w3.org/2000/svg';
  const STORE_KEY = 'vscalc-project-v1';

  // ---------- Tillstånd ----------
  const DEFAULT_SETTINGS = {
    dvut: -18, tIn: 21, height: 2.5,
    uWall: 0.6, uWindow: 2.8, uDoor: 2.0, uRoof: 0.3, uFloor: 0.5,
    tGround: 8, tBasement: 10, tCrawl: 0,
    airChanges: 0.5, heatRecovery: 0, thermalBridge: 0.1,
    above: 'vind', below: 'kallare',
    tf: 70, trDesign: 50, dpKPa: 10,
    calcMode: 'dt', dtWater: 15, tempMethod: 'aritmetisk', valveSensor: 'Max', flowMargin: 0,
  };
  function defaultDb() {
    try { return C.parseRadiatorCsv(window.VSCALC_DEFAULT_CSV || ''); } catch (e) { return []; }
  }
  function newProject() {
    return { version: 1, name: 'Nytt projekt', settings: { ...DEFAULT_SETTINGS },
      plan: { image: null, w: 2000, h: 1400, pxPerM: 100 }, rooms: [], radiators: [], db: defaultDb() };
  }
  let P = migrate(load()) || newProject();
  function migrate(p) {
    if (!p) return p;
    p.settings = { ...DEFAULT_SETTINGS, ...p.settings };
    if (!p.db || !p.db.length || p.db.every(d => String(d.id).startsWith('ex-'))) p.db = defaultDb();
    (p.radiators || []).forEach(r => { if (!r.count) r.count = 1; });
    return p;
  }
  function sysParams() {
    const s = P.settings;
    return { mode: s.calcMode, dt: s.dtWater, tf: s.tf, trDesign: s.trDesign, dpKPa: s.dpKPa,
      method: s.tempMethod, sensor: s.valveSensor, margin: s.flowMargin };
  }
  let mode = 'pan', selRoom = null, draft = [], rectStart = null, scalePts = [];
  let view = { x: 0, y: 0, w: P.plan.w, h: P.plan.h };

  function load() {
    try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); }
      catch (e) { hint('Kunde inte autospara i webbläsaren (för stor ritning?). Använd "Spara projekt".'); }
    }, 300);

  const uid = () => Math.random().toString(36).slice(2, 9);
  const fmt = (v, d = 0) => (v == null || !isFinite(v)) ? '–' : v.toLocaleString('sv-SE', { minimumFractionDigits: d, maximumFractionDigits: d });
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function roomGeom(room) {

      area: C.polygonArea(pts),
      walls: room.pts.map((p, i) => ({

  function computeRoom(room) {
    const s = P.settings;

      above: room.above || s.above, below: room.below || s.below,

    const loss = C.roomHeatLoss(calcRoom, s);
    const tIn = isFinite(parseFloat(room.tIn)) ? parseFloat(room.tIn) : s.tIn;

    const qtyOk = r => { const d = P.db.find(x => x.id === r.dbId); return d && (d.unit === 'st' || parseFloat(r.qty) > 0); };

      const d = P.db.find(x => x.id === r.dbId);
      const count = Math.max(1, parseInt(r.count) || 1);
      return d ? { rad: r, db: d, count, pNom: C.nominalPower(d, r.qty) * count, norm: d.norm, n: d.n, dpKPa: r.dpKPa } : null;

  function el(tag, attrs, parent) {

  function draw() {
    svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);

        class: 'room' + (room.id === selRoom ? ' sel' : '') }, g);

      const t = el('text', { x: c.x, y: c.y, class: 'roomlabel', 'font-size': fs, style: `stroke-width:${3 * pxPerScreen()}px` }, g);
      t.textContent = room.name;
      const t2 = el('text', { x: c.x, y: c.y + fs * 1.2, class: 'roomlabel', 'font-size': fs * 0.9, style: `stroke-width:${3 * pxPerScreen()}px` }, g);
      t2.textContent = r ? `${fmt(r.loss.total)} W` + (r.bal.overdim != null && r.rads.length ? ` · ${fmtPct(r.bal.overdim)}` : '') : '';
    }
    const rs = 7 * pxPerScreen();
    for (const rad of P.radiators) {
      const d = P.db.find(x => x.id === rad.dbId);
      const cls = 'rad' + (!rad.roomId ? ' unassigned' : '') + (d && d.unit !== 'st' && !(parseFloat(rad.qty) > 0) ? ' incomplete' : '');
      const rect = el('rect', { x: rad.x - rs * 1.6, y: rad.y - rs / 2, width: rs * 3.2, height: rs, rx: rs / 4, class: cls }, svg);
      const tt = el('title', {}, rect);
      tt.textContent = (d ? d.name : 'Okänd radiator') + (rad.raw ? ` (avläst: "${rad.raw}")` : '') + (!rad.roomId ? ' – ligger inte i något rum' : '');
      rect.addEventListener('click', ev => {
        if (mode !== 'pan' && mode !== 'rad') return;

        if (room) selRoom = room.id;
        openRadDialog(room || null, rad, rad);
      });
    }
    if (draft.length) {
      el('polyline', { points: draft.map(p => `${p.x},${p.y}`).join(' '), class: 'draft' }, svg);
      draft.forEach(p => el('circle', { cx: p.x, cy: p.y, r: 4 * pxPerScreen(), class: 'vertex' }, svg));
    }
    scalePts.forEach(p => el('circle', { cx: p.x, cy: p.y, r: 5 * pxPerScreen(), class: 'vertex' }, svg));
    $('#scaleInfo').textContent = `Skala: ${fmt(P.plan.pxPerM, 1)} px/m`;
  }
  function drawGrid() {
    const k = P.plan.pxPerM;
    el('rect', { x: 0, y: 0, width: P.plan.w, height: P.plan.h, fill: 'var(--panel)' }, svg);

    for (let y = 0; y <= P.plan.h; y += k) el('line', { x1: 0, y1: y, x2: P.plan.w, y2: y, stroke: 'var(--line)', 'vector-effect': 'non-scaling-stroke' }, svg);
  }

    view = { x: (P.plan.w - w) / 2, y: (P.plan.h - h) / 2, w, h };

  // ---------- Interaktion ----------
  const HINTS = {
    pan: 'Dra för att flytta, scrolla för att zooma. Klicka på ett rum för att redigera det.',
    scale: 'Klicka på två punkter med känt avstånd (t.ex. ett måttsatt väggmått).',
    room: 'Klicka ut rummets hörn. Klicka på första punkten (eller tryck Enter) för att stänga. Esc avbryter. Hörn fäster mot befintliga hörn.',
    rect: 'Dra från ett hörn till det motsatta för att rita ett rektangulärt rum.',
    edge: 'Klicka på en vägg för att markera/avmarkera den som yttervägg (röd).',
    rad: 'Klicka i ett rum där radiatorn sitter.',
  };
  function hint(t) { $('#hint').textContent = t; }
  function setMode(m) {
    mode = m; draft = []; scalePts = []; rectStart = null;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    hint(HINTS[m]); draw();
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  svg.addEventListener('pointerdown', ev => {
    const p = svgPoint(ev);

  svg.addEventListener('pointerup', async ev => {

      const p = snap(svgPoint(ev)), a = rectStart; rectStart = null; draft = [];
      if (Math.abs(p.x - a.x) > 5 && Math.abs(p.y - a.y) > 5)
        await addRoom([a, { x: p.x, y: a.y }, p, { x: a.x, y: p.y }]);

    else if (mode === 'scale') {
      scalePts.push(p); draw();
      if (scalePts.length === 2) {
        const px = C.dist(scalePts[0], scalePts[1]);
        const m = parseFloat(String(await ask(`Avstånd mellan punkterna i meter (${fmt(px)} px):`, '')).replace(',', '.'));
        if (m > 0) { P.plan.pxPerM = px / m; changed(); hint(`Skala satt: ${fmt(P.plan.pxPerM, 1)} px/m.`); }
        scalePts = []; draw();
      }
    } else if (mode === 'room') {
      const q = snap(p);
      if (draft.length >= 3 && C.dist(q, draft[0]) < 10 * pxPerScreen()) { await closeDraft(); return; }

  }

      if (!x) { lines.push(base.concat(['', '', r.incomplete.length ? 'sektioner saknas' : 'ingen radiator']).join(';')); continue; }
      lines.push(base.concat([n2(r.bal.available), n2(r.bal.overdim * 100), x.db.name, n2(x.rad.qty), x.count, n2(pr.pReq),
        n2(pr.tf), n2(pr.tr), pr.ok ? n2(pr.flowLh) : 'räcker ej', n2(pr.flowEach), n2(pr.dpKPa), n2(pr.kv),
        pr.ok ? (pr.valve.setting ?? 'ej möjlig') : '', !pr.ok ? pr.reason : pr.overRef ? 'Tillopp över referens' : pr.valve.status]).join(';'));
    }
    download('﻿' + lines.join('\r\n'), 'injustering.csv', 'text/csv');
  };

  // ---------- Indata ----------
  const FIELDS = [
    ['Klimat', [['dvut', 'DVUT (dim. utetemp) °C', 1], ['tIn', 'Rumstemperatur °C', 0.5], ['height', 'Rumshöjd m', 0.05]]],
    ['U-värden W/m²K', [['uWall', 'Yttervägg', 0.01], ['uWindow', 'Fönster', 0.01], ['uDoor', 'Ytterdörr', 0.01], ['uRoof', 'Tak / vindsbjälklag', 0.01], ['uFloor', 'Golv', 0.01], ['thermalBridge', 'Köldbryggetillägg (andel, 0,1 = 10 %)', 0.01]]],
    ['Temperatur under golv °C', [['tGround', 'Mark (platta)', 1], ['tBasement', 'Ouppvärmd källare', 1], ['tCrawl', 'Kryprum', 1]]],
    ['Ventilation', [['airChanges', 'Luftomsättning oms/h (inkl. läckage)', 0.05], ['heatRecovery', 'Värmeåtervinning (andel 0–1)', 0.05]]],
    ['Beräkningsmetod', [
      ['calcMode', 'Metod', { dt: 'Fast ΔT vatten → beräkna tillopp/retur (Strandskatan)', tf: 'Fast framledning → beräkna retur' }],
      ['dtWater', 'ΔT vatten K (metod ΔT)', 0.5],
      ['tf', 'Framledning °C (metod framledning)', 1],
      ['trDesign', 'Dim. retur °C (för faktor, metod framledning)', 1],
      ['tempMethod', 'Temperaturdifferens', { aritmetisk: 'Aritmetisk (som Excel-mallen)', logaritmisk: 'Logaritmisk (LMTD)' }],
    ]],
    ['Ventiler', [
      ['dpKPa', 'Differenstryck över ventil kPa (för kv)', 0.5],
      ['valveSensor', 'Termostatgivare RA-DV PURE', { 'Max': 'Max (utan givare)', 'RA 2000': 'RA 2000', 'RAW/RAE/RAS-C': 'RAW/RAE/RAS-C' }],
      ['flowMargin', 'Flödesmarginal ventilval (andel, 0,1 = 10 %)', 0.05],
    ]],
  ];
  function renderSettings() {
    const field = ([k, l, st]) => typeof st === 'object'
      ? `<label class="f">${l}<select data-set="${k}" data-kind="str">${Object.entries(st).map(([v, t]) => `<option value="${esc(v)}"${P.settings[k] === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`
      : `<label class="f">${l}<input type="number" step="${st}" data-set="${k}" value="${P.settings[k]}"></label>`;
    $('#settingsForm').innerHTML = FIELDS.map(([title, f]) => `<div class="panel"><h2>${title}</h2>${f.map(field).join('')}</div>`).join('') +
      `<div class="panel"><h2>Om beräkningen</h2><p class="note">Transmission: U·A·(t<sub>inne</sub> − DVUT) för yttervägg (minus fönster/dörr), fönster och tak när kall vind/yttertak finns ovanför. Golv räknas mot angiven temperatur under. Ventilation: 1,2·q·Δt·(1 − återvinning), q = oms/h · volym.</p>
      <p class="note">Radiatoreffekt: P = P<sub>kat</sub>·(Δθ / Δθ<sub>ref</sub>)<sup>n</sup>, Δθ<sub>ref</sub> = 60 K vid 90/70/20. Metod ΔT: behövd Δθ = Δθ<sub>ref</sub>·(P<sub>behov</sub>/P<sub>kat</sub>)<sup>1/n</sup>, tillopp = Δθ + t<sub>rum</sub> + ΔT/2, retur = tillopp − ΔT. Flöde = P / (ΔT · 4,2 · 1000) · 3600 l/h.</p>
      <p class="note">kv = q[m³/h] / √(Δp[bar]). RA-DV PURE: lägsta inställning vars flöde ≥ behovet inkl. marginal (Danfoss datablad 12/2025; halvsteg interpolerade).</p></div>`;
    document.querySelectorAll('[data-set]').forEach(i => i.addEventListener('change', () => {
      if (i.dataset.kind === 'str') { P.settings[i.dataset.set] = i.value; changed(); return; }
      const v = parseFloat(String(i.value).replace(',', '.')); if (isFinite(v)) { P.settings[i.dataset.set] = v; changed(); }
    }));
  }

  // ---------- Databas ----------
  function renderDb() {
    $('#dbTable').innerHTML = `<tr><th>Namn</th><th style="text-align:left">Typ</th><th>Höjd cm</th><th>Effekt W</th><th>Per</th><th>Normtemp</th><th>n</th></tr>` +
      P.db.map(d => `<tr><td>${esc(d.name)}</td><td style="text-align:left">${esc(d.type)}</td><td>${esc(d.height)}</td><td>${fmt(d.power, 1)}</td><td>${esc(d.unit)}</td><td>${d.norm.tf}/${d.norm.tr}/${d.norm.ti}</td><td>${d.n}</td></tr>`).join('');
  }
  $('#fileCsv').addEventListener('change', async ev => {
    const f = ev.target.files[0]; if (!f) return;
    const buf = await f.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('\ufffd')) text = new TextDecoder('windows-1252').decode(buf); // Excel-export
    try {
      const list = C.parseRadiatorCsv(text);
      if ($('#csvReplace').checked) P.db = list; else P.db = P.db.concat(list.filter(d => !P.db.some(x => x.id === d.id)));
      changed(); alertNote(`${list.length} radiatorer importerade.`);
    } catch (e) { alertNote('Fel vid import: ' + e.message); }
    ev.target.value = '';
  });
  $('#btnDbExport').onclick = () => {
    const rows = ['id;namn;typ;fabrikat;höjd_mm;längd_mm;effekt;enhet;normtemp;exponent'].concat(P.db.map(d =>
      [d.id, d.name, d.type, d.maker, d.height, d.length, String(d.power).replace('.', ','), d.unit, `${d.norm.tf}/${d.norm.tr}/${d.norm.ti}`, String(d.n).replace('.', ',')].join(';')));
    download('﻿' + rows.join('\r\n'), 'radiatorer.csv', 'text/csv');
  };
  $('#btnDbReset').onclick = () => { P.db = defaultDb(); changed(); };
  function alertNote(t) { hint(t); const n = document.createElement('p'); n.className = 'note'; n.textContent = t; $('#dbTable').before(n); setTimeout(() => n.remove(), 5000); }

  // ---------- Filer ----------
  const MAX_PLAN_PX = 3000; // håller projektfilen hanterbar
  function setPlanFromCanvas(cv, pxPerM) {
    P.plan.image = cv.toDataURL('image/jpeg', 0.85); P.plan.w = cv.width; P.plan.h = cv.height;
    if (pxPerM) P.plan.pxPerM = pxPerM;
    changed(); fit();
    if (pxPerM) { setMode('pan'); hint(`Skala satt från ritningen: ${fmt(pxPerM, 1)} px/m. Kontrollera gärna mot ett känt mått med "Skala".`); }
    else setMode('scale');
  }
  function loadScript(src) {
    return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('Kunde inte ladda ' + src)); document.head.appendChild(sc); });
  }
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  async function loadPdf(file) {
    hint('Läser PDF …');
    if (!window.pdfjsLib) {
      await loadScript(PDFJS + 'pdf.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    }
    const data = new Uint8Array(await file.arrayBuffer());
    const doc = await window.pdfjsLib.getDocument({ data }).promise;
    let pageNo = 1;
    if (doc.numPages > 1) {
      const a = await ask(`PDF:en har ${doc.numPages} sidor. Vilken sida är planritningen?`, '1');
      if (a === null) return;
      pageNo = Math.min(doc.numPages, Math.max(1, parseInt(a) || 1));
    }
    const page = await doc.getPage(pageNo);
    const vp1 = page.getViewport({ scale: 1 });
    const scale = MAX_PLAN_PX / Math.max(vp1.width, vp1.height);
    const vp = page.getViewport({ scale });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const found = await readDesignations(page, vp);
    // PDF-enheter är punkter (1 pt = 25,4/72 mm på papperet). Med känd ritningsskala ges px/m direkt.
    const a = await ask('Ritningens skala 1: (t.ex. 100). Lämna tomt för att kalibrera själv med två punkter. Gäller bara om PDF:en är i originalstorlek, inte inskannad i annan storlek.', '100');
    const denom = parseFloat(String(a || '').replace(',', '.'));
    const pxPerM = denom > 0 ? (1000 / denom) / (25.4 / 72) * scale : null;
    if (found.length) {
      P.radiators.push(...found);
      assignRadiators();
    }
    setPlanFromCanvas(cv, pxPerM);
    if (found.length) hint(`${found.length} radiatorbeteckningar avlästa ur ritningen (orange markeringar). Kontrollera dem – klicka på en markering för att ändra. ` + $('#hint').textContent);
    else hint('Inga radiatorbeteckningar hittades i PDF:ens text. ' + $('#hint').textContent);
  }
  /** Läser PDF-sidans text, slår ihop ord på samma rad och letar radiatorbeteckningar. */
  async function readDesignations(page, vp) {
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => {
      const [x, y] = vp.convertToViewportPoint(it.transform[4], it.transform[5]);
      const h = Math.hypot(it.transform[2], it.transform[3]) * vp.scale;
      const w = (it.width || 0) * vp.scale;
      return { str: it.str, x, y, h, w };
    });
    // Gruppera i rader (liknande y), sortera på x och bygg en sträng med positionskarta
    items.sort((a, b) => a.y - b.y || a.x - b.x);
    const lines = [];
    for (const it of items) {
      const line = lines.find(l => Math.abs(l.y - it.y) < Math.max(2, it.h * 0.4) && it.x - l.end < it.h * 2);
      if (line) { line.items.push(it); line.end = Math.max(line.end, it.x + it.w); } else lines.push({ y: it.y, end: it.x + it.w, items: [it] });
    }
    const out = [];
    for (const l of lines) {
      l.items.sort((a, b) => a.x - b.x);
      let text = '', map = [];
      for (const it of l.items) { if (text) { text += ' '; map.push(it); } for (const _ of it.str) map.push(it); text += it.str; }
      for (const m of C.findDesignations(text, P.db)) {
        const it = map[m.index] || l.items[0];
        out.push({ id: uid(), roomId: null, x: it.x + (it.w || 0) / 2, y: it.y - it.h / 2, dbId: m.dbId, qty: m.qty, count: m.count, dpKPa: '', auto: true, raw: m.raw });
      }
    }
    return out;
  }
  $('#fileImage').addEventListener('change', async ev => {
    const f = ev.target.files[0]; if (!f) return;
    ev.target.value = '';
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
      try { await loadPdf(f); } catch (e) { hint('Kunde inte läsa PDF:en: ' + e.message); }
      return;
    }
    if (!f.type.startsWith('image/')) { hint('Ladda ritningen som PDF eller bild (PNG/JPG).'); return; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAX_PLAN_PX / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); setPlanFromCanvas(cv, null);
    };
    img.onerror = () => hint('Kunde inte läsa bilden.');
    img.src = url;
  });
  $('#btnExport').onclick = () => download(JSON.stringify(P), 'vscalc-projekt.json', 'application/json');
  $('#fileProject').addEventListener('change', async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try { P = Object.assign(newProject(), JSON.parse(await f.text())); P.settings = { ...DEFAULT_SETTINGS, ...P.settings }; selRoom = null; changed(); fit(); }
    catch (e) { hint('Kunde inte läsa projektfilen.'); }
    ev.target.value = '';
  });
  $('#btnNew').onclick = async () => {
    if ((await ask('Skriv JA för att börja ett nytt projekt (nuvarande töms).', '')) !== 'JA') return;
    const db = P.db; P = newProject(); P.db = db; selRoom = null; changed(); fit();
  };
  $('#btnFit').onclick = fit;
  // I claude.ai-artefakter går nedladdning via plattformens downloads-capability; annars vanlig länk.
  const dlPromise = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  async function download(content, name, type) {
    const dl = await dlPromise;
    if (dl) {
      try { await dl.save({ filename: name, data: content }); }
      catch (e) { if (e && e.code !== 'declined') hint('Kunde inte spara filen: ' + (e.message || e.code)); }
      return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------- Flikar ----------
  let tab = 'plan';
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.view;
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + tab));
    refresh(); if (tab === 'plan') fit();
  }));

  function refresh() {
    if (tab === 'plan') { draw(); renderSide(); }
    if (tab === 'results') renderResults();
    if (tab === 'settings') renderSettings();
    if (tab === 'db') renderDb();
  }
  function changed() { save(); refresh(); }
  window.addEventListener('resize', () => tab === 'plan' && fit());

  setMode('pan'); fit(); refresh();
})();
</script>
</body>
